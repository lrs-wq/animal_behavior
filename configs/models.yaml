# Coat/appearance classifier. Class names must match identity cats coat_class.
coat_classifier_model: /root/Eating_behavior/models/coat_classifier_best.pt
coat_classifier_model_sha256: a1b832acf1155c5671d4cac8848d15427daf854e1bb68042231ddaa32a89d322

# Optional RTMPose top-down model. Enable it in configs/pipeline.yaml only after
# replacing these empty values with the matching, trusted AP-10K artifacts.
pose:
  config:
  config_sha256:
  checkpoint:
  checkpoint_sha256:

security:
  # .pt/.pth artifacts use pickle internally. Keep this explicit and pin the
  # exact trusted files above; prefer ONNX/TensorRT for future deployments.
  allow_pickle_weights: true
  require_sha256: true
  allowed_roots:
    - /root/Eating_behavior/models

