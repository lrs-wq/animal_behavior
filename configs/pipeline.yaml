detection:
  # YOLO detection thresholds. cat is the full cat box, feeding_head marks eating.
  confidence: 0.60
  iou: 0.70
  # Always apply project-owned class-aware NMS. Some end-to-end checkpoints
  # bypass Ultralytics NMS, making its iou argument ineffective.
  nms_iou: 0.70
  imgsz: 640
  cat_classes:
    - cat
  feeding_classes:
    - feeding_head

coat:
  # Coat classifier settings. Tiny cat crops skip classification.
  imgsz: 128
  min_area: 16384
  confidence: 0.55
  min_margin: 0.05

pose:
  # The production registry enables RTMPose only with all four models.pose
  # fields pinned. Development overrides may disable it on machines without
  # the OpenMMLab runtime.
  enabled: true
  min_cat_area: 4096
  max_instances_per_frame: 8
  keypoint_confidence: 0.30
  quality:
    # New tracks need strong connected evidence; established tracks use lower
    # keep thresholds so brief occlusion does not make the skeleton flicker.
    enabled: true
    min_bbox_area_enter: 8192
    min_bbox_area_keep: 6144
    min_bbox_short_side: 64
    point_enter_confidence: 0.50
    point_keep_confidence: 0.30
    enter_min_points: 5
    enter_min_edges: 3
    enter_min_anchors: 1
    keep_min_points: 3
    keep_min_edges: 1
  smoothing:
    # State is isolated by source_id and track_id. Coordinates are filtered in
    # bbox-local space so ordinary detector-box motion is not mistaken for a
    # keypoint jump.
    max_bridge_gap_seconds: 0.15
    reset_gap_seconds: 0.30
    one_euro_min_cutoff: 1.0
    one_euro_beta: 0.5
    one_euro_derivative_cutoff: 1.0
    reference_dt_seconds: 0.05
    core_hold_frames: 3
    joint_hold_frames: 2
    paw_hold_frames: 2
  posture:
    # This geometry classifier is active only when pose.enabled is also true.
    # ``eating`` additionally requires an unambiguous feeding_head association;
    # a lowered head alone is not treated as eating.
    enabled: true
    min_keypoint_confidence: 0.35
    min_feeding_confidence: 0.50
    min_visible_keypoints: 5
    min_body_length_ratio: 0.12
    min_supporting_paws: 2
    min_complete_leg_chains: 1
    lying_max_clearance_ratio: 0.10
    crouching_min_clearance_ratio: 0.10
    crouching_max_clearance_ratio: 0.22
    standing_min_front_drop_ratio: 0.18
    standing_min_hind_drop_ratio: 0.15
    standing_min_clearance_ratio: 0.20
    standing_min_leg_straightness: 0.78
    # A candidate must remain stable before cat_posture_changed is committed.
    transition_confirm_seconds: 0.50
    min_confirmed_observations: 3
    # Bound unknown-cat state, historical aliases, and orphaned retry envelopes.
    max_anonymous_subjects_per_source: 64

tracking:
  # Tracking is source-local. Smoothed boxes are used only for pose crops; raw
  # boxes remain the evidence for identity and eating-event decisions.
  enabled: true
  match_iou: 0.20
  max_center_distance_ratio: 0.60
  # Fail open (no inherited pose history) when two assignments are nearly tied.
  ambiguity_margin: 0.05
  max_age_seconds: 0.75
  bbox_smoothing_seconds: 0.12
  max_tracks_per_source: 32

association:
  # Maximum feeding-center to cat-box distance, normalized by cat diagonal.
  max_distance_ratio: 0.50
  # Reject nearly tied candidates instead of guessing between cats.
  ambiguity_margin: 0.10

worker:
  # Production workers should receive only assigned source_id/camera_id values.
  # Empty means run all configured sources in this local snapshot.
  source_ids: []
  # Production snapshots should set require_assignments=true and
  # allow_debug_source=false so CLI input cannot expand worker authorization.
  require_assignments: false
  allow_debug_source: true

sources: []
# Worker-local source snapshot example. stream_url is not an identity key:
# sources:
#   - source_id: cam_customer_a_01
#     stream_url: rtsp://customer-a.example/live
#   - source_id: cam_customer_b_01
#     stream_url: rtsp://customer-b.example/live

identity:
  # Confirm identity directly only when one cat in the source household has the
  # predicted coat_class.
  direct_when_single_same_coat: true
  unknown_name: unknown
  # Backward-compatible default household for single-customer/debug configs.
  cats: []
  # Single-household example:
  # cats:
  #   - name: ragdoll
  #     coat_class: mixed_white_ragdoll
  #   - name: silver_pure
  #     coat_class: silver_gray_white
  # Multi-customer example. Identity routing uses stable source_id/camera_id,
  # not the raw stream_url.
  # households:
  #   - household_id: customer_a_home
  #     source_ids:
  #       - cam_customer_a_01
  #     cats:
  #       - name: customer_a_blue
  #         coat_class: blue_cat
  #   - household_id: customer_b_home
  #     source_ids:
  #       - cam_customer_b_01
  #     cats:
  #       - name: customer_b_blue
  #         coat_class: blue_cat

events:
  # Reuse recent confirmed same-source and same-coat identity for eating events.
  identity_history_seconds: 8.0
  # Source-local eating state machine (seconds, not frame counts).
  enter_seconds: 2.0
  exit_seconds: 5.0
  merge_gap_seconds: 10.0
  min_event_seconds: 2.0
  event_confirm_ratio: 0.60
  min_identity_observations: 2
  max_identity_candidates: 32
  # Do not publish a real-looking food-status event until that model exists.
  emit_bowl_placeholder: false
  # ``cat_passed`` is kept as the public compatibility name for an any-cat
  # presence reminder. The first visible frame is announced immediately;
  # reminders repeat only while a cat is visible. User-specific config
  # snapshots can override the default 30-minute interval.
  cat_presence:
    repeat_interval_seconds: 1800.0
    # Ignore shorter detector gaps when deciding whether the cat disappeared.
    absence_confirm_seconds: 2.0
    # Optional per-user/household overrides; source ownership still determines
    # which household setting is used.
    household_repeat_interval_seconds: {}
    # Example:
    # household_repeat_interval_seconds:
    #   customer_a_home: 900.0
  # Kept for backward-compatible configs; completed eating events are emitted
  # once by the state machine rather than periodically throttled observations.
  eating_event_interval_seconds: 2.0
  # Placeholder interval for future food-status model output.
  bowl_monitor_interval_seconds: 30.0

output:
  # Events are appended incrementally; only this bounded tail stays in memory.
  save_event_jsonl: true
  save_event_csv: true
  max_recent_events: 1000
  # Frame persistence is intentionally unavailable until retention and access
  # controls are defined.
  save_frames: false
