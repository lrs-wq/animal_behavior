detection:
  # YOLO detection thresholds. cat is the full cat box, feeding_head marks eating.
  confidence: 0.25
  iou: 0.70
  imgsz: 640
  cat_classes:
    - cat
  feeding_classes:
    - feeding_head

coat:
  # Coat classifier settings. Tiny cat crops skip classification.
  imgsz: 128
  min_area: 16384
  confidence: 0.0

worker:
  # Production workers should receive only assigned source_id/camera_id values.
  # Empty means run all configured sources in this local snapshot.
  source_ids: []

sources: []
# Worker-local source snapshot example. stream_url is not an identity key:
# sources:
#   - source_id: cam_customer_a_01
#     stream_url: rtsp://customer-a.example/live
#   - source_id: cam_customer_b_01
#     stream_url: rtsp://customer-b.example/live

identity:
  # Confirm identity directly only when one cat in the source household has the
  # predicted coat_class.
  direct_when_single_same_coat: true
  unknown_name: unknown
  # Backward-compatible default household for single-customer/debug configs.
  cats: []
  # Single-household example:
  # cats:
  #   - name: ragdoll
  #     coat_class: mixed_white_ragdoll
  #   - name: silver_pure
  #     coat_class: silver_gray_white
  # Multi-customer example. Identity routing uses stable source_id/camera_id,
  # not the raw stream_url.
  # households:
  #   - household_id: customer_a_home
  #     source_ids:
  #       - cam_customer_a_01
  #     cats:
  #       - name: customer_a_blue
  #         coat_class: blue_cat
  #   - household_id: customer_b_home
  #     source_ids:
  #       - cam_customer_b_01
  #     cats:
  #       - name: customer_b_blue
  #         coat_class: blue_cat

events:
  # Reuse recent confirmed same-source and same-coat identity for eating events.
  identity_history_seconds: 8.0
  # Event throttling intervals are scoped by source_id.
  pass_event_interval_seconds: 5.0
  eating_event_interval_seconds: 2.0
  # Placeholder interval for future food-status model output.
  bowl_monitor_interval_seconds: 30.0

output:
  # Output toggles reserved for future output policies.
  save_event_jsonl: true
  save_event_csv: true
  save_frames: false
