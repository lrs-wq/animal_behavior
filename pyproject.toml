[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eating-behavior-formal"
version = "0.1.0"
description = "Realtime cat detection, coat routing, identity confirmation, and eating event inference."
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.4.58",
  "opencv-python>=4.10",
  "numpy>=1.26",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
# OpenMMLab's CUDA wheel index and torch CUDA build cannot be expressed in
# project metadata. Use requirements/rtmpose-cu121.txt for deployment.
rtmpose = [
  "mmcv==2.1.0",
  "mmengine==0.10.7",
  "mmdet==3.3.0",
  "mmpose==1.3.2",
  "xtcocotools==1.14.3",
]

[project.scripts]
eating-behavior = "eating_behavior.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
