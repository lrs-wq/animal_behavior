<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07111f" />
    <title>JoyAI 实时视频监控</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="app-shell">
      <section id="bootView" class="boot-view" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>正在检查登录状态…</p>
      </section>

      <section id="loginView" class="login-view hidden" aria-labelledby="loginTitle">
        <div class="login-card">
          <div class="login-brand">
            <div class="brand-mark" aria-hidden="true"><span></span></div>
            <div>
              <p class="eyebrow">JOYAI LIVE</p>
              <h1 id="loginTitle">实时视频监控</h1>
            </div>
          </div>

          <p class="login-intro">登录后查看已接入的摄像头实时画面。</p>

          <form id="loginForm" novalidate>
            <label for="username">用户名</label>
            <div class="field-wrap">
              <span class="field-icon" aria-hidden="true">人</span>
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                maxlength="128"
                required
                autofocus
              />
            </div>

            <label for="password">密码</label>
            <div class="field-wrap">
              <span class="field-icon" aria-hidden="true">钥</span>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                maxlength="256"
                required
              />
              <button id="togglePassword" class="text-button" type="button" aria-label="显示密码">
                显示
              </button>
            </div>

            <p id="loginMessage" class="form-message" role="alert"></p>
            <button id="loginButton" class="primary-button" type="submit">
              <span>登录</span>
              <span class="button-arrow" aria-hidden="true">→</span>
            </button>
          </form>

          <div class="security-note">
            <span class="status-dot"></span>
            HTTPS 加密连接 · 不提供公开注册
          </div>
        </div>
      </section>

      <section id="dashboardView" class="dashboard-view hidden" aria-labelledby="pageTitle">
        <header class="topbar">
          <div class="topbar-brand">
            <div class="brand-mark small" aria-hidden="true"><span></span></div>
            <div>
              <p class="eyebrow">JOYAI LIVE</p>
              <h1 id="pageTitle">实时视频监控</h1>
            </div>
          </div>

          <div class="topbar-actions">
            <div class="system-state" title="媒体服务在线">
              <span class="status-dot pulse"></span>
              <span>系统运行中</span>
            </div>
            <time id="currentTime" class="current-time"></time>
            <button id="logoutButton" class="secondary-button" type="button">退出登录</button>
          </div>
        </header>

        <div class="dashboard-summary">
          <div>
            <p class="summary-label">实时画面</p>
            <h2>已接入 <span id="streamCount">0</span> 路视频</h2>
          </div>
          <p class="summary-hint">低延迟 HLS · 1080P · 25 FPS</p>
        </div>

        <div id="streamGrid" class="stream-grid" aria-live="polite"></div>

        <footer class="dashboard-footer">
          <span>画面存在约 1–3 秒网络延迟属于正常现象</span>
          <span id="sessionUser"></span>
        </footer>
      </section>
    </main>

    <template id="streamCardTemplate">
      <article class="stream-card">
        <header class="stream-header">
          <div>
            <div class="stream-title-row">
              <span class="live-badge"><i></i>LIVE</span>
              <h3 class="stream-name"></h3>
            </div>
            <p class="stream-description"></p>
          </div>
          <div class="stream-actions">
            <button class="icon-button refresh-button" type="button" title="重新连接">↻</button>
            <button class="icon-button fullscreen-button" type="button" title="全屏查看">⛶</button>
          </div>
        </header>

        <div class="video-frame">
          <div class="video-placeholder">
            <div class="spinner small-spinner" aria-hidden="true"></div>
            <span>正在连接视频流…</span>
          </div>
        </div>

        <footer class="stream-footer">
          <div class="stream-health"><span class="status-dot"></span><span>正在连接</span></div>
          <div class="quality-tags"><span>1080P</span><span>25 FPS</span><span>H.264</span></div>
        </footer>
      </article>
    </template>
  </body>
</html>
