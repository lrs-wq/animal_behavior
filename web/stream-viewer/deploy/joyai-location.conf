# Included inside the ai.hzzootech.com HTTP and HTTPS server blocks.
location = /joyai {
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
    return 301 /joyai/;
}

# Nginx auth_request subrequest. This endpoint is never public.
location = /_joyai_session_auth {
    internal;
    proxy_pass http://127.0.0.1:8099/api/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# High-throughput HLS delivery stays in Nginx. Only authenticated sessions
# reach MediaMTX, and upstream media credentials never enter the browser.
location ^~ /joyai/stream/ {
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    auth_request /_joyai_session_auth;

    proxy_pass http://127.0.0.1:8888/;
    proxy_redirect / /joyai/stream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $joyai_hls_upstream_authorization;
    proxy_hide_header WWW-Authenticate;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# The login page and lightweight session API are served by Node.js.
location /joyai/ {
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    proxy_pass http://127.0.0.1:8099/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 16k;
}
